<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sentence Calculator · NDPS Act, 1985</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #eef0f4;
    --paper: #ffffff;
    --ink: #11172a;
    --ink-2: #3b4358;
    --ink-3: #7a8298;
    --rule: #e3e6ee;
    --rule-2: #cfd4e0;
    --brand: #1c2c66;
    --brand-2: #2c4ab5;
    --brand-ink: #0b1a4a;
    --calc: #1f3fa5;
    --calc-hover: #16308a;
    --result-bg: #eef3ff;
    --warn: #a8341d;
    --warn-soft: #fdecea;
    --ok: #1e6a3e;
    --ok-soft: #eaf6ee;
    --aggrav: #c0334a;
    --aggrav-soft: #fceef0;
    --mitig: #1e6a3e;
    --mitig-soft: #ebf5ed;
    --pill-grad: linear-gradient(95deg, #6e2bd6 0%, #c63aa7 100%);
    --shadow-1: 0 1px 0 rgba(17,23,42,0.04), 0 1px 2px rgba(17,23,42,0.04);
    --shadow-2: 0 1px 0 rgba(17,23,42,0.04), 0 12px 32px -16px rgba(17,23,42,0.18);
    --shadow-pill: 0 6px 16px -6px rgba(154,42,178,0.55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    line-height: 1.45;
    padding-bottom: 120px;
  }
  button { font-family: inherit; cursor: pointer; }
  input, select { font-family: inherit; }
  .serif { font-family: 'Source Serif 4', Georgia, serif; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* ---------- Header ---------- */
  .header {
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
    padding: 18px 28px 16px;
  }
  .header-inner {
    max-width: 1340px; margin: 0 auto;
    display: grid;
    grid-template-columns: 64px 1fr auto;
    align-items: center;
    gap: 20px;
  }
  .seal {
    width: 56px; height: 56px;
    object-fit: contain;
    display: block;
    line-height: 1;
  }
  .seal::after {
    content: "";
    position: absolute;
  }
  .header-title h1 {
    margin: 0;
    color: var(--brand-ink);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.04em;
    font-family: 'Source Serif 4', serif;
  }
  .header-title .actname {
    color: var(--ink-3);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 4px;
    font-weight: 500;
  }
  .pill-warn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--pill-grad);
    color: #fff;
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    border: none;
    box-shadow: var(--shadow-pill);
    letter-spacing: 0.01em;
  }
  .pill-warn .ic {
    width: 16px; height: 16px; border-radius: 50%;
    background: rgba(255,255,255,0.25);
    display: grid; place-items:center;
    font-size: 11px;
  }
  .disclaimer-strip {
    max-width: 1340px; margin: 0 auto;
    padding: 8px 4px 0;
    color: var(--warn);
    font-size: 12px;
    font-style: italic;
  }

  /* ---------- Shell ---------- */
  .shell {
    max-width: 1340px;
    margin: 22px auto 0;
    padding: 0 28px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
    gap: 22px;
  }
  @media (max-width: 1080px) { .shell { grid-template-columns: 1fr; } }

  .col { display: flex; flex-direction: column; gap: 22px; }

  .card {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 10px;
    box-shadow: var(--shadow-1);
    overflow: hidden;
  }
  .card-head {
    padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--rule);
  }
  .card-head h2 {
    margin: 0;
    color: var(--brand);
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .card-head.aggrav h2 { color: var(--aggrav); }
  .card-head.mitig h2 { color: var(--mitig); }
  .card-head .actions { display: flex; gap: 6px; }
  .btn {
    background: var(--calc);
    color: #fff;
    border: 1px solid var(--calc);
    padding: 7px 14px;
    border-radius: 5px;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  .btn:hover { background: var(--calc-hover); border-color: var(--calc-hover); }
  .btn:disabled { background: #a8b1c4; border-color: #a8b1c4; cursor: not-allowed; }
  .btn.ghost {
    background: var(--paper); color: var(--ink-2); border-color: var(--rule-2);
  }
  .btn.ghost:hover { background: #f5f6fa; color: var(--ink); }
  .btn.tab {
    background: var(--paper); color: var(--ink-2); border-color: var(--rule-2);
    border-radius: 5px; padding: 6px 12px; font-size: 12px;
  }
  .btn.tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn-icon { display: inline-flex; align-items: center; gap: 6px; }

  .card-body { padding: 18px; }
  .card-body.tight { padding: 14px 18px; }

  /* ---------- Form ---------- */
  .form-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--rule);
  }
  .form-row:last-child { border-bottom: 0; }
  .form-row label {
    font-size: 13px; color: var(--ink-2);
  }
  .form-row .sub-label {
    display: block;
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 2px;
    font-style: italic;
  }
  .input {
    border: 1px solid var(--rule-2);
    background: var(--paper);
    border-radius: 5px;
    padding: 7px 10px;
    font-size: 13px;
    color: var(--ink);
    width: 180px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .input:focus { outline: none; border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(44,74,181,0.12); }
  .input.num { width: 90px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
  .input.sm { width: 64px; padding: 5px 8px; font-size: 12px; text-align: right; font-family: 'JetBrains Mono', monospace; }
  .input-group { display: flex; gap: 6px; align-items: center; }
  .select {
    border: 1px solid var(--rule-2);
    background: var(--paper);
    border-radius: 5px;
    padding: 7px 26px 7px 10px;
    font-size: 13px;
    color: var(--ink);
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%237a8298' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 8px center;
    cursor: pointer;
  }

  /* ---------- Results panel ---------- */
  .results {
    margin-top: 14px;
    background: var(--result-bg);
    border: 1px solid #d6e0ff;
    border-radius: 6px;
    padding: 12px 14px;
  }
  .result-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    padding: 4px 0;
    font-size: 12.5px;
    color: var(--ink-2);
  }
  .result-row .v {
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 12.5px;
  }
  .result-row .v.big {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 14px;
  }

  /* ---------- Banner ---------- */
  .banner {
    margin: 8px 0 0;
    background: var(--brand);
    color: #fff;
    border-radius: 5px;
    padding: 9px 14px;
    font-size: 12px;
    font-weight: 500;
    text-align: center;
    letter-spacing: 0.01em;
  }
  .banner.cap { background: #14467a; }

  /* ---------- Tables ---------- */
  .table-head {
    display: grid;
    grid-template-columns: 30px 1fr 90px 90px 90px;
    gap: 10px;
    padding: 10px 18px;
    background: #f7f9fc;
    border-bottom: 1px solid var(--rule);
    border-top: 1px solid var(--rule);
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-2);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .table-head .num-col {
    text-align: center;
    font-size: 10.5px;
    line-height: 1.25;
  }
  .table-head .num-col em {
    display: block; font-style: normal; font-weight: 400;
    color: var(--ink-3); font-size: 10px; margin-top: 2px;
    text-transform: none; letter-spacing: 0;
  }
  .factor-row {
    display: grid;
    grid-template-columns: 30px 1fr 90px 90px 90px;
    gap: 10px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--rule);
    align-items: center;
    font-size: 12.5px;
  }
  .factor-row:last-of-type { border-bottom: 0; }
  .factor-row:hover { background: #fafbfd; }
  .factor-row .idx {
    display: inline-flex; gap: 6px; align-items: center;
    font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--ink-3);
  }
  .factor-row .arrow { font-size: 13px; line-height: 1; }
  .factor-row.aggrav .arrow { color: var(--aggrav); }
  .factor-row.mitig .arrow { color: var(--mitig); }
  .factor-row .label { color: var(--ink); line-height: 1.45; }
  .factor-row .cell { text-align: right; }

  .table-foot {
    display: grid;
    grid-template-columns: 30px 1fr 90px 90px 90px;
    gap: 10px;
    padding: 11px 18px;
    background: #f7f9fc;
    border-top: 1px solid var(--rule);
    font-size: 12.5px;
    font-weight: 600;
  }
  .table-foot .label { color: var(--ink-2); grid-column: 1 / 3; }
  .table-foot .val { text-align: right; font-family: 'JetBrains Mono', monospace; color: var(--ink); }
  .table-foot .val.aggrav { color: var(--aggrav); }
  .table-foot .val.mitig { color: var(--mitig); }

  .custom-row {
    display: flex; gap: 8px; padding: 12px 18px;
    background: #fafbfd;
    border-top: 1px solid var(--rule);
  }
  .custom-row input {
    flex: 1;
    border: 1px solid var(--rule-2);
    border-radius: 5px;
    padding: 7px 10px;
    font-size: 12.5px;
  }

  /* ---------- Report ---------- */
  .report-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px;
    border-bottom: 1px solid var(--rule);
  }
  .report-head h2 { margin: 0; font-size: 12px; letter-spacing: 0.18em; color: var(--ink-3); font-weight: 700; text-transform: uppercase; }
  .report-tabs { display: flex; gap: 6px; }
  .report-body { padding: 18px; }
  .report-body h3 {
    margin: 0 0 12px;
    font-family: 'Source Serif 4', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.3;
  }
  .spec-row {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 14px;
    padding: 7px 0;
    border-bottom: 1px dashed var(--rule);
    font-size: 12.5px;
  }
  .spec-row:last-child { border-bottom: 0; }
  .spec-row .k { color: var(--ink-2); }
  .spec-row .v { color: var(--ink); font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .spec-row .v.na { color: var(--ink-3); }

  .report-section + .report-section { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--rule); }

  .disclaimer-box {
    margin-top: 18px;
    background: #fff8ed;
    border: 1px solid #f3d8a0;
    border-radius: 6px;
    padding: 10px 12px;
    display: flex; gap: 10px; align-items: flex-start;
    font-size: 12px;
  }
  .disclaimer-box .ic {
    color: #b97910;
    font-size: 16px;
    line-height: 1;
  }
  .disclaimer-box .body { color: var(--ink-2); }
  .disclaimer-box .body b { display: block; color: #8a5b0a; font-size: 12px; margin-bottom: 3px; }

  /* ---------- Floating action bar ---------- */
  .fab-bar {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(180deg, #2c5cca 0%, #1c3fa5 100%);
    border-radius: 999px;
    padding: 6px;
    display: flex; gap: 6px;
    box-shadow: 0 10px 30px -8px rgba(28,63,165,0.45), inset 0 1px 0 rgba(255,255,255,0.2);
    z-index: 50;
  }
  .fab {
    width: 44px; height: 44px; border-radius: 50%;
    border: 0; background: transparent;
    color: #fff;
    display: grid; place-items: center;
    transition: background 0.15s;
  }
  .fab:hover { background: rgba(255,255,255,0.15); }
  .fab.active { background: #fff; color: var(--brand); }
  .fab svg { width: 18px; height: 18px; }

  /* ---------- Footer ---------- */
  footer.site {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--brand-ink);
    color: #c8cee0;
    font-size: 12px;
    padding: 10px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    z-index: 40;
  }
  footer.site a { color: #f3c244; text-decoration: none; }
  footer.site a:hover { text-decoration: underline; }
  footer.site .pip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  footer.site .survey { color: #f3c244; }

  /* ---------- Small helpers ---------- */
  .row-flex { display: flex; align-items: center; gap: 8px; }
  .hint-row {
    font-size: 11px;
    color: var(--ink-3);
    font-style: italic;
    padding: 0 18px 14px;
  }
  .summary-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
  }
  .summary-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 14px;
    padding: 7px 0;
    font-size: 12.5px;
    color: var(--ink-2);
  }
  .summary-row .v {
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
  }
  .summary-row .v.big {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 14px;
  }
  details summary { cursor: pointer; outline: none; }
  details summary::-webkit-details-marker { display: none; }

  .toast {
    position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff;
    padding: 10px 16px; border-radius: 8px;
    font-size: 13px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <img class="seal" src="/assets/logo.png" alt="Sentence Calculator" />
    <div class="header-title">
      <h1>SENTENCE CALCULATOR</h1>
      <div class="actname">The Narcotic Drugs and Psychotropic Substances Act, 1985 (India)</div>
    </div>
    <button class="pill-warn"><span class="ic">!</span> Consider without Relying</button>
  </div>
  <div class="disclaimer-strip">Computed values are an aid for legal practitioners. They are not to be treated as decisive or replace the Court's independent reasoning.</div>
</header>

<div id="root"></div>

<div class="toast" id="toast">Copied to clipboard</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
